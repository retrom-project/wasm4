name: RPG Runtime Release

on:
  push:
    tags: ["retrom-core-gca2600db8de4-r*"]

permissions:
  contents: write

concurrency:
  group: rpg-runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable release identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^retrom-core-gca2600db8de4-r[1-9][0-9]*(-rc\.[1-9][0-9]*)?$ ]]
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin \
            '+refs/heads/retrom/gca2600db8de4:refs/remotes/origin/retrom/gca2600db8de4'
          git merge-base --is-ancestor "$GITHUB_SHA" origin/retrom/gca2600db8de4
          git merge-base --is-ancestor ca2600db8de49d0d228ed57dd6c6778fb579a013 "$GITHUB_SHA"
          test -z "$(git rev-list --min-parents=2 ca2600db8de49d0d228ed57dd6c6778fb579a013.."$GITHUB_SHA")"
          python3 .github/rpg-runtime/verify-source.py
      - name: Build Web assets
        run: |
          mkdir "$RUNNER_TEMP/rpg-runtime-output"
          .github/rpg-runtime/build-web.sh "$RUNNER_TEMP/rpg-runtime-output"
      - name: Validate and describe assets
        run: |
          python3 .github/rpg-runtime/verify-release.py \
            --output "$RUNNER_TEMP/rpg-runtime-output" \
            --repository "https://github.com/$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA"
      - name: Create immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" \
            --verify-tag --target "$GITHUB_SHA" \
            --title "WASM-4 Web runtime $GITHUB_REF_NAME" --generate-notes \
            "$RUNNER_TEMP/rpg-runtime-output/wasm4-retrom.mjs" \
            "$RUNNER_TEMP/rpg-runtime-output/LICENSE.txt" \
            "$RUNNER_TEMP/rpg-runtime-output/rpg-runtime-release.json"
